name: Проверка привязки PR к issue

# Гарантирует, что каждый PR ссылается на issue ключевым словом
# (Fixes/Closes/Resolves #N) либо явно помечен как не связанный
# с issue. Наличие такой ссылки автоматически закрывает issue
# при merge (встроенное поведение GitHub).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  require-linked-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка описания PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';

            // Ссылка на issue: "Fixes #123", "Closes #123", "Resolves #123"
            const linked = /(?:fixes|closes|resolves)\s+#\d+/i.test(body);
            // Явный маркер, что PR не связан с issue
            const notLinked = /\[нет связанных issues\]/i.test(body);

            if (linked) {
              console.log('OK: PR привязан к issue, он закроется автоматически при merge.');
              return;
            }
            if (notLinked) {
              console.log('OK: PR явно помечен как не связанный с issue.');
              return;
            }

            const hint = [
              '⚠️ В описании этого PR нет привязки к issue.',
              '',
              'Добавь строку `Fixes #N` (или `Closes #N` / `Resolves #N`),',
              'тогда GitHub автоматически закроет issue при merge.',
              '',
              'Если изменение **не связано** ни с одним issue — впиши маркер:',
              '`[нет связанных issues]`'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: hint
            });
            core.setFailed('PR не привязан к issue: отсутствует "Fixes #N" либо маркер "[нет связанных issues]"');